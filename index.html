<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D Autenticador - Pagamento e Acesso</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 6px;
    }

    .description {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .price-tag {
      font-size: 32px;
      font-weight: 700;
      color: #22c55e;
      margin-bottom: 24px;
    }

    /* Container dos botões Pix e WhatsApp */
    .pix-actions-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn-pix, .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      box-sizing: border-box;
    }

    /* Estilo do botão Copiar Pix */
    .btn-pix {
      background-color: #00bdae;
      color: #ffffff;
      border: none;
    }

    .btn-pix:hover {
      background-color: #00998c;
    }

    /* Estilo do botão WhatsApp */
    .btn-whatsapp {
      background-color: #25d366;
      color: #ffffff;
      border: none;
    }

    .btn-whatsapp:hover {
      background-color: #1ebc57;
    }

    .btn-pix:active, .btn-whatsapp:active {
      transform: scale(0.98);
    }

    .pix-info {
      font-size: 13px;
      color: #64748b;
      margin-top: 18px;
    }

    .pix-info strong {
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">D Autenticador</div>
    <h1 class="title">Adquirir Código de Acesso</h1>
    <p class="description">Realize o pagamento via Pix para solicitar a liberação do seu código.</p>
    
    <div class="price-tag">R$ 50,00</div>

    <!-- Bloco de Ações Pix / WhatsApp -->
    <div class="pix-actions-container">
      <!-- Botão Copiar Chave Pix -->
      <button type="button" class="btn-pix" id="btnCopyPix" onclick="copiarChavePix()">
        Copiar chave Pix
      </button>

      <!-- Botão Solicitar Código (WhatsApp) -->
      <a 
        href="https://wa.me/5598984650323?text=Oi%2C%20j%C3%A1%20fiz%20meu%20pagamento%2C%20quero%20solicitar%20meu%20c%C3%B3digo%20de%20acesso" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="btn-whatsapp"
      >
        Solicitar código
      </a>
    </div>

    <div class="pix-info">
      Chave Pix: <strong>98984650323</strong>
    </div>
  </div>

  <script>
    function copiarChavePix() {
      const chavePix = "98984650323";
      
      navigator.clipboard.writeText(chavePix).then(() => {
        const btn = document.getElementById("btnCopyPix");
        const textoOriginal = btn.innerText;
        
        btn.innerText = "Chave Pix Copiada!";
        btn.style.backgroundColor = "#28a745";
        
        setTimeout(() => {
          btn.innerText = textoOriginal;
          btn.style.backgroundColor = "#00bdae";
        }, 2000);
      }).catch(err => {
        alert("Sua chave Pix é: " + chavePix);
      });
    }
  </script>

</body>
</html>
